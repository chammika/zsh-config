"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#957FB8)\
$os\
$username\
[](bg:#D27E99 fg:#957FB8)\
$directory\
[](fg:#D27E99 bg:#FFA066)\
$git_branch\
$git_status\
[](fg:#FFA066 bg:#7E9CD8)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#7E9CD8 bg:#7AA89F)\
$docker_context\
[](fg:#7AA89F bg:#2D4F67)\
$time\
[ ](fg:#2D4F67)\
$line_break\
$character"""

# Disable the blank line at the start of the prompt
add_newline = false

# Prompt symbol on its own line, Kanagawa springGreen / samuraiRed
[character]
success_symbol = '[❯](bold #98BB6C)'
error_symbol = '[❯](bold #E82424)'

# Hide gcloud account (email) from the prompt
[gcloud]
disabled = true

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:#1F1F28 bg:#957FB8"
style_root = "fg:#1F1F28 bg:#957FB8"
format = '[$user ]($style)'
disabled = true

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "fg:#1F1F28 bg:#957FB8"
disabled = true # Disabled by default

[directory]
style = "fg:#1F1F28 bg:#D27E99"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "fg:#1F1F28 bg:#7AA89F"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "fg:#1F1F28 bg:#FFA066"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#1F1F28 bg:#FFA066"
format = '[$all_status$ahead_behind ]($style)'
# Counts like p10k (kept from the previous config)
modified = '!$count '
untracked = '?$count '
staged = '+$count '
stashed = '*$count '
deleted = '✘$count '
renamed = '»$count '
conflicted = '=$count '
ahead = '⇡$count '
behind = '⇣$count '
diverged = '⇡$ahead_count⇣$behind_count '

[golang]
symbol = " "
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "fg:#1F1F28 bg:#7E9CD8"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#DCD7BA bg:#2D4F67"
format = '[ ♥ $time ]($style)'
