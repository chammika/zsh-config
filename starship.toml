# Hide gcloud account (email) from the prompt
[gcloud]
disabled = true

# Git status like p10k: no brackets, counts, softer colour
[git_status]
format = '([$all_status$ahead_behind]($style))'
style = 'yellow'
modified = '!$count '
untracked = '?$count '
staged = '+$count '
stashed = '*$count '
deleted = '✘$count '
renamed = '»$count '
conflicted = '=$count '
ahead = '⇡$count '
behind = '⇣$count '
diverged = '⇡$ahead_count⇣$behind_count '
