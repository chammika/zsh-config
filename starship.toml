# No blank line before the prompt (default true)
add_newline = false

# Hide gcloud account (email) from the prompt
[gcloud]
disabled = true

# Git status like p10k: no brackets, counts, softer colour
[git_status]
format = '([$all_status$ahead_behind]($style))'
style = 'yellow'
modified = '!$count '
untracked = '?$count '
staged = '+$count '
stashed = '*$count '
deleted = '✘$count '
renamed = '»$count '
conflicted = '=$count '
ahead = '⇡$count '
behind = '⇣$count '
diverged = '⇡$ahead_count⇣$behind_count '

# Language modules: no-runtime-versions preset with "via" removed

[bun]
format = "[$symbol]($style)"

[buf]
format = "with [$symbol]($style)"

[c]
format = "[$symbol($name)]($style)"

[cmake]
format = "[$symbol]($style)"

[cobol]
format = "[$symbol]($style)"

[cpp]
